# version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flashcard
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flashcard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .:/app
    ports:
      - "5433:5432"
    restart: unless-stopped

  cron:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "while true; do node src/main.js; sleep 60; done"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/flashcard
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules: